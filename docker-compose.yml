services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventario
      POSTGRES_USER: inventario
      POSTGRES_PASSWORD: inventario_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventario"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports: ["5433:5432"]

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://inventario:inventario_secret@postgres:5432/inventario
      SKIP_AUTH: "true"
      LOG_LEVEL: INFO
      AVATAR_DIR: /tmp/avatars
      CORS_ORIGINS: "http://localhost:8080,http://localhost:6001,http://localhost:5173"
      FORCE_RESEED: "true"
    ports: ["8008:6000"]
    command: >
      sh -c "until python -c 'import socket; socket.create_connection((\"postgres\", 5432))' 2>/dev/null; do echo 'waiting for postgres...'; sleep 2; done && echo 'Postgres ready!' && uvicorn app.main:app --host 0.0.0.0 --port 6000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6000/v1/healthz"]
      interval: 20s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_SKIP_AUTH: "true"
    restart: unless-stopped
    depends_on: [backend]
    ports: ["8080:6001"]

volumes:
  postgres_data:
